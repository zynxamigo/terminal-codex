<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Terminal Codex — 100% Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0d1117;
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
      color: #c9d1d9;
    }

    /* Top bar - minimal VSCode style */
    #topbar {
      height: 32px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 4px;
      user-select: none;
    }
    .tab {
      height: 28px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px 4px 0 0;
      font-size: 12px;
      color: #8b949e;
      cursor: pointer;
      gap: 6px;
    }
    .tab.active {
      background: #0d1117;
      color: #c9d1d9;
      border-bottom-color: #0d1117;
    }
    .tab .close {
      font-size: 14px;
      opacity: 0.6;
    }
    .tab .close:hover { opacity: 1; color: #f85149; }
    #new-tab {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 18px;
      cursor: pointer;
      border-radius: 4px;
    }
    #new-tab:hover { background: #21262d; color: #c9d1d9; }

    /* Terminal area - 100% focus */
    #terminal-container {
      position: absolute;
      top: 32px;
      bottom: 28px;
      left: 0;
      right: 0;
      background: #0d1117;
    }
    #terminal {
      width: 100%;
      height: 100%;
      padding: 4px;
    }

    /* Status bar - VSCode style */
    #statusbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 28px;
      background: #161b22;
      border-top: 1px solid #30363d;
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 12px;
      color: #8b949e;
      gap: 16px;
      user-select: none;
    }
    #statusbar .left { display: flex; gap: 16px; }
    #statusbar .right { margin-left: auto; display: flex; gap: 16px; }
    .status-item { display: flex; align-items: center; gap: 4px; }
    .status-item.green { color: #3fb950; }
    .status-item.blue { color: #58a6ff; }

    /* Quick commands bar (Termux vibe) - appears on long press or button */
    #quickbar {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      height: 40px;
      background: #161b22;
      border-top: 1px solid #30363d;
      display: none;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
      overflow-x: auto;
      z-index: 10;
    }
    #quickbar.show { display: flex; }
    .qbtn {
      flex-shrink: 0;
      padding: 6px 12px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #c9d1d9;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }
    .qbtn:hover { background: #30363d; border-color: #58a6ff; }

    /* Toggle quickbar button */
    #toggle-quick {
      position: absolute;
      bottom: 32px;
      right: 8px;
      width: 32px;
      height: 32px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 50%;
      color: #8b949e;
      font-size: 16px;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #toggle-quick:hover { background: #30363d; color: #c9d1d9; }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="tab active" data-id="1">
      <span>session-1</span>
      <span class="close">×</span>
    </div>
    <button id="new-tab" title="Nova sessão">+</button>
  </div>

  <div id="terminal-container">
    <div id="terminal"></div>
  </div>

  <div id="quickbar">
    <button class="qbtn" data-cmd="ls -la">ls -la</button>
    <button class="qbtn" data-cmd="cd ~">cd ~</button>
    <button class="qbtn" data-cmd="pwd">pwd</button>
    <button class="qbtn" data-cmd="clear">clear</button>
    <button class="qbtn" data-cmd="uname -a">uname</button>
    <button class="qbtn" data-cmd="df -h">df -h</button>
    <button class="qbtn" data-cmd="free -h">free</button>
    <button class="qbtn" data-cmd="ps aux">ps</button>
    <button class="qbtn" data-cmd="htop">htop</button>
    <button class="qbtn" data-cmd="exit">exit</button>
  </div>

  <button id="toggle-quick" title="Comandos rápidos">⚡</button>

  <div id="statusbar">
    <div class="left">
      <span class="status-item green">● connected</span>
      <span class="status-item">bash</span>
      <span class="status-item">utf-8</span>
    </div>
    <div class="right">
      <span class="status-item blue" id="cwd">~/</span>
      <span class="status-item" id="cols-rows">80×24</span>
      <span class="status-item">Terminal Codex</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
  <script>
    // ========== Terminal Codex — 100% focus ==========
    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'block',
      fontFamily: "'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace",
      fontSize: 14,
      lineHeight: 1.2,
      theme: {
        background: '#0d1117',
        foreground: '#c9d1d9',
        cursor: '#58a6ff',
        cursorAccent: '#0d1117',
        selectionBackground: '#264f78',
        black: '#484f58',
        red: '#ff7b72',
        green: '#3fb950',
        yellow: '#d29922',
        blue: '#58a6ff',
        magenta: '#bc8cff',
        cyan: '#39c5cf',
        white: '#b1bac4',
        brightBlack: '#6e7681',
        brightRed: '#ffa198',
        brightGreen: '#56d364',
        brightYellow: '#e3b341',
        brightBlue: '#79c0ff',
        brightMagenta: '#d2a8ff',
        brightCyan: '#56d4dd',
        brightWhite: '#f0f6fc'
      },
      allowProposedApi: true,
      scrollback: 5000
    });

    const fitAddon = new FitAddon.FitAddon();
    const webLinksAddon = new WebLinksAddon.WebLinksAddon();
    term.loadAddon(fitAddon);
    term.loadAddon(webLinksAddon);

    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // Fake shell state
    let cwd = '~';
    let prompt = () => `\x1b[32muser@codex\x1b[0m:\x1b[34m${cwd}\x1b[0m$ `;
    let buffer = '';
    let history = [];
    let histIdx = -1;

    function writePrompt() {
      term.write(prompt());
    }

    function updateStatus() {
      document.getElementById('cwd').textContent = cwd;
      document.getElementById('cols-rows').textContent = `${term.cols}×${term.rows}`;
    }

    // Boot message
    term.writeln('\x1b[1;36m╔══════════════════════════════════════════════════╗\x1b[0m');
    term.writeln('\x1b[1;36m║          TERMINAL CODEX  —  100% TERMINAL        ║\x1b[0m');
    term.writeln('\x1b[1;36m║     50% VSCode  +  50% Termux  =  MIL VEZES      ║\x1b[0m');
    term.writeln('\x1b[1;36m╚══════════════════════════════════════════════════╝\x1b[0m');
    term.writeln('');
    term.writeln('\x1b[90mDigite comandos. Use as setas ↑↓ pro histórico.\x1b[0m');
    term.writeln('\x1b[90mBotão ⚡ = comandos rápidos estilo Termux.\x1b[0m');
    term.writeln('');
    writePrompt();
    updateStatus();

    // Input handling
    term.onData(data => {
      const code = data.charCodeAt(0);

      // Enter
      if (data === '\r') {
        term.write('\r\n');
        const cmd = buffer.trim();
        if (cmd) {
          history.push(cmd);
          histIdx = history.length;
          runCommand(cmd);
        } else {
          writePrompt();
        }
        buffer = '';
        return;
      }

      // Backspace
      if (data === '\x7f') {
        if (buffer.length > 0) {
          buffer = buffer.slice(0, -1);
          term.write('\b \b');
        }
        return;
      }

      // Ctrl+C
      if (data === '\x03') {
        term.write('^C\r\n');
        buffer = '';
        writePrompt();
        return;
      }

      // Ctrl+L (clear)
      if (data === '\x0c') {
        term.clear();
        writePrompt();
        return;
      }

      // Arrow Up
      if (data === '\x1b[A') {
        if (histIdx > 0) {
          histIdx--;
          // clear current line
          term.write('\r\x1b[K');
          term.write(prompt());
          buffer = history[histIdx];
          term.write(buffer);
        }
        return;
      }

      // Arrow Down
      if (data === '\x1b[B') {
        if (histIdx < history.length - 1) {
          histIdx++;
          term.write('\r\x1b[K');
          term.write(prompt());
          buffer = history[histIdx];
          term.write(buffer);
        } else {
          histIdx = history.length;
          term.write('\r\x1b[K');
          term.write(prompt());
          buffer = '';
        }
        return;
      }

      // Printable
      if (code >= 32) {
        buffer += data;
        term.write(data);
      }
    });

    // Fake command runner (client-side demo)
    function runCommand(cmd) {
      const parts = cmd.split(/\s+/);
      const base = parts[0];

      switch (base) {
        case 'clear':
        case 'cls':
          term.clear();
          break;
        case 'pwd':
          term.writeln(cwd === '~' ? '/home/user' : cwd);
          break;
        case 'cd':
          if (parts[1]) {
            if (parts[1] === '~' || parts[1] === '/') {
              cwd = '~';
            } else if (parts[1] === '..') {
              cwd = '~';
            } else {
              cwd = parts[1].startsWith('/') ? parts[1] : `${cwd === '~' ? '' : cwd}/${parts[1]}`;
            }
          } else {
            cwd = '~';
          }
          break;
        case 'ls':
        case 'll':
          term.writeln('\x1b[34mdir1\x1b[0m  \x1b[34mdir2\x1b[0m  file.txt  README.md  script.sh');
          break;
        case 'whoami':
          term.writeln('user');
          break;
        case 'uname':
          term.writeln('Linux codex 6.8.0-generic #1 SMP x86_64 GNU/Linux');
          break;
        case 'date':
          term.writeln(new Date().toString());
          break;
        case 'echo':
          term.writeln(parts.slice(1).join(' '));
          break;
        case 'help':
          term.writeln('Comandos demo: ls, cd, pwd, clear, whoami, uname, date, echo, help');
          term.writeln('Isso é um frontend. Pra shell real, pluga WebSocket depois.');
          break;
        case 'exit':
          term.writeln('Saindo... (demo)');
          break;
        default:
          term.writeln(`\x1b[31mcommand not found: ${base}\x1b[0m`);
          term.writeln('\x1b[90m(digite help pra ver os comandos demo)\x1b[0m');
      }
      writePrompt();
      updateStatus();
    }

    // Quick bar
    document.getElementById('toggle-quick').addEventListener('click', () => {
      document.getElementById('quickbar').classList.toggle('show');
    });

    document.querySelectorAll('.qbtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cmd = btn.dataset.cmd;
        // simulate typing + enter
        term.write(cmd);
        buffer = cmd;
        term.write('\r\n');
        history.push(cmd);
        histIdx = history.length;
        runCommand(cmd);
        buffer = '';
        document.getElementById('quickbar').classList.remove('show');
      });
    });

    // Resize
    window.addEventListener('resize', () => {
      fitAddon.fit();
      updateStatus();
    });

    // Focus on click
    document.getElementById('terminal-container').addEventListener('click', () => term.focus());
    term.focus();
  </script>
</body>
</html>
